<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>期货期限结构分析</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', 'SimHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 30px;
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5em;
        }
        
        .main-content {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 30px;
        }
        
        .form-panel {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 12px;
            height: fit-content;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
            font-size: 14px;
        }
        
        input, select {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .help-text {
            color: #999;
            font-size: 12px;
            margin-top: 5px;
            line-height: 1.4;
        }
        
        button {
            width: 100%;
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(102, 126, 234, 0.4);
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .result-panel {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }
        
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .tab-btn {
            padding: 10px 24px;
            border: none;
            background: #f8f9fa;
            color: #666;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .tab-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .chart-container {
            background: white;
            padding: 25px;
            border-radius: 12px;
            border: 2px solid #e0e0e0;
        }
        
        .chart-container img {
            width: 100%;
            height: auto;
            border-radius: 8px;
        }
        
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
        }
        
        .info-card {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            padding: 25px;
            border-radius: 12px;
        }
        
        .info-card h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.3em;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .info-card p {
            color: #666;
            line-height: 1.8;
        }
        
        .strategy-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .strategy-card h3 {
            color: white;
        }
        
        .strategy-card p {
            color: #f0f0f0;
            line-height: 1.8;
        }
        
        .table-container {
            background: white;
            padding: 25px;
            border-radius: 12px;
            border: 2px solid #e0e0e0;
            overflow-x: auto;
        }
        
        .data-table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .data-table th,
        .data-table td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }
        
        .data-table th {
            background: #f8f9fa;
            font-weight: 600;
            color: #333;
            position: sticky;
            top: 0;
        }
        
        .data-table tr:hover {
            background: #f8f9fa;
        }
        
        .data-table tr:last-child td {
            border-bottom: none;
        }
        
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #667eea;
            font-size: 18px;
            background: white;
            border-radius: 12px;
        }
        
        .error {
            background: #ffebee;
            color: #c62828;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .stats-row {
            display: flex;
            gap: 30px;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        
        .stat-item {
            background: rgba(255,255,255,0.6);
            padding: 10px 20px;
            border-radius: 8px;
        }
        
        .stat-label {
            font-size: 12px;
            color: #666;
        }
        
        .stat-value {
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }
        
        @media (max-width: 900px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            
            .info-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="container">            
            <div class="main-content">
                <div class="form-panel">
                    <div class="form-group">
                        <label for="username">快期账号</label>
                        <input type="text" id="username" v-model="form.username" placeholder="请输入快期账号">
                    </div>
                    
                    <div class="form-group">
                        <label for="password">密码</label>
                        <input type="password" id="password" v-model="form.password" placeholder="请输入密码">
                    </div>
                    
                    <div class="form-group">
                        <label for="contractInput">合约代码</label>
                        <input type="text" id="contractInput" v-model="form.contractInput" placeholder="例如：SHFE.ni2603">
                        <p class="help-text">系统会自动提取品种前缀，生成未来 N 个月的合约列表</p>
                    </div>
                    
                    <div class="form-group">
                        <label for="numMonths">合约月份数</label>
                        <input type="number" id="numMonths" v-model="form.numMonths" min="1" max="60" value="12">
                    </div>
                    
                    <div v-if="errorMessage" class="error">
                        {{ errorMessage }}
                    </div>
                    
                    <button @click="handleQuery" :disabled="isLoading">
                        {{ isLoading ? '⏳ 分析中...' : '🚀 开始分析' }}
                    </button>
                </div>
                
                <div class="result-panel" v-if="showResult">
                    <div class="tabs">
                        <button class="tab-btn" :class="{ active: activeTab === 'chart' }" @click="activeTab = 'chart'">
                            📈 期限结构图
                        </button>
                        <button class="tab-btn" :class="{ active: activeTab === 'table' }" @click="activeTab = 'table'">
                            📊 价格数据表
                        </button>
                    </div>
                    
                    <div class="tab-content" :class="{ active: activeTab === 'chart' }">
                        <div class="chart-container">
                            <img :src="chartData" alt="期限结构图">
                        </div>
                    </div>
                    
                    <div class="tab-content" :class="{ active: activeTab === 'table' }">
                        <div class="table-container">
                            <table class="data-table">
                                <thead>
                                    <tr>
                                        <th>合约代码</th>
                                        <th>收盘价</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr v-for="item in tableData" :key="item.contract">
                                        <td>{{ item.contract }}</td>
                                        <td>{{ item.price }}</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                    
                    <div class="info-grid">
                        <div class="info-card">
                            <h3>📈 期限结构状态</h3>
                            <p>{{ structure }}</p>
                            <div class="stats-row">
                                <div class="stat-item">
                                    <div class="stat-label">最近月价格</div>
                                    <div class="stat-value">{{ nearPrice }}</div>
                                </div>
                                <div class="stat-item">
                                    <div class="stat-label">最远月价格</div>
                                    <div class="stat-value">{{ farPrice }}</div>
                                </div>
                                <div class="stat-item" v-if="priceDiffPct !== 0">
                                    <div class="stat-label">价差幅度</div>
                                    <div class="stat-value">{{ priceDiffPct }}%</div>
                                </div>
                                <div class="stat-item" v-if="priceCv !== 0">
                                    <div class="stat-label">变异系数</div>
                                    <div class="stat-value">{{ priceCv }}%</div>
                                </div>
                            </div>
                        </div>
                        
                        <div class="info-card strategy-card">
                            <h3>💡 交易策略建议</h3>
                            <p>{{ strategy }}</p>
                        </div>
                    </div>
                </div>
                
                <div v-if="isLoading" class="loading">
                    正在获取数据并生成图表，请稍候...
                </div>
            </div>
        </div>
    </div>
    
    <script type="module">
        import { createApp } from 'https://unpkg.com/vue@3/dist/vue.esm-browser.js'
        import axios from 'https://cdn.jsdelivr.net/npm/axios@1.6.0/+esm'
        
        createApp({
            data() {
                return {
                    form: {
                        username: '',
                        password: '',
                        contractInput: '',
                        numMonths: 12
                    },
                    isLoading: false,
                    showResult: false,
                    errorMessage: '',
                    chartData: '',
                    structure: '',
                    nearPrice: 0,
                    farPrice: 0,
                    strategy: '',
                    priceDiffPct: 0,
                    priceCv: 0,
                    tableData: [],
                    activeTab: 'chart'
                }
            },
            methods: {
                async handleQuery() {
                    if (!this.form.username || !this.form.password || !this.form.contractInput) {
                        this.errorMessage = '请输入账号、密码和合约代码'
                        return
                    }
                    
                    this.isLoading = true
                    this.errorMessage = ''
                    this.showResult = false
                    this.activeTab = 'chart'
                    
                    try {
                        const response = await axios.post('/api/query', {
                            username: this.form.username,
                            password: this.form.password,
                            contract_input: this.form.contractInput,
                            num_months: this.form.numMonths
                        }, {
                            timeout: 60000
                        })
                        
                        if (response.data.success) {
                            this.chartData = 'data:image/png;base64,' + response.data.chart
                            this.structure = response.data.structure
                            this.nearPrice = response.data.near_price
                            this.farPrice = response.data.far_price
                            this.strategy = response.data.strategy
                            this.priceDiffPct = response.data.price_diff_pct || 0
                            this.priceCv = response.data.price_cv || 0
                            this.tableData = response.data.data
                            this.showResult = true
                        }
                    } catch (error) {
                        if (error.response) {
                            this.errorMessage = error.response.data.detail || '请求失败，请重试'
                        } else if (error.code === 'ECONNABORTED') {
                            this.errorMessage = '请求超时，请检查网络连接或合约代码是否正确'
                        } else {
                            this.errorMessage = '网络错误，请检查网络连接: ' + error.message
                        }
                    } finally {
                        this.isLoading = false
                    }
                }
            }
        }).mount('#app')
    </script>
</body>
</html>
